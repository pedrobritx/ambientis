# Disposable local Auth/PostgREST development stack; never link this seed to a hosted project.
project_id = "ambientis-local"

[api]
enabled = true
port = 54621
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54622
shadow_port = 54620
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 54623

[local_smtp]
enabled = true
port = 54624

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3421"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# CLI uses this flag to enable the email provider, including existing-user login.
# New accounts remain blocked by auth.enable_signup above.
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54627
